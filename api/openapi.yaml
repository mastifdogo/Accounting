openapi: 3.0.3
info:
  title: Ledger API
  version: 0.1.0
  description: |
    API for a lightweight double-entry accounting ledger.

    ## Money
    Every monetary value is an **integer number of cents** (minor units of a
    single ledger currency). Floating-point numbers are never used. Integers are
    capped at 9007199254740991 (2^53 - 1) so they are exact in JavaScript.

    ## Double entry
    A journal entry has at least two lines. Each line is either a debit or a
    credit: exactly one of `debit_cents` / `credit_cents` is greater than zero
    and the other is zero. The total debits of an entry must equal its total
    credits. The database enforces these rules as well.

    ## Immutability
    Posted journal entries cannot be edited or deleted. To correct a mistake,
    post a reversing entry (`POST /journal-entries/{id}/reverse`) and then a
    new, correct entry.

    ## CSV files
    Exports and imports live in the server's CSV directory (`/app/csv_data`).
    Files are UTF-8 encoded, comma separated, with a header row and no BOM.
servers:
  - url: /api/v1

tags:
  - name: System
  - name: Accounts
  - name: Journal Entries
  - name: Reports
  - name: Files

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness and database connectivity check
      responses:
        '200':
          description: Service and database are reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Database unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List the chart of accounts
      parameters:
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Accounts ordered by code
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get one account with its current balance
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: Rename, re-describe or (de)activate an account
      description: |
        The account `code` and `type` are not editable here. Inactive accounts
        keep their history but cannot receive new postings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdate' }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /accounts/{accountId}/ledger:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      operationId: getAccountLedger
      summary: Posting history of one account with running balance
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Ledger lines ordered by date, entry id, line number
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountLedger' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /journal-entries:
    get:
      tags: [Journal Entries]
      operationId: listJournalEntries
      summary: List posted journal entries (newest first)
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: account_id
          in: query
          description: Only entries with at least one line on this account
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of journal entries
          content:
            application/json:
              schema:
                type: object
                required: [data, limit, offset]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/JournalEntry' }
                  limit: { type: integer }
                  offset: { type: integer }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Journal Entries]
      operationId: createJournalEntry
      summary: Post a balanced journal entry
      description: |
        The header and all lines are written in a single database transaction.
        If any line is invalid, or the entry does not balance, nothing is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JournalEntryCreate' }
            example:
              entry_date: '2026-10-01'
              description: Office supplies paid in cash
              reference: RCPT-0042
              lines:
                - { account_id: 7, debit_cents: 4599, credit_cents: 0, memo: Printer paper }
                - { account_id: 1, debit_cents: 0, credit_cents: 4599 }
      responses:
        '201':
          description: Entry posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntry' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /journal-entries/{entryId}:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    get:
      tags: [Journal Entries]
      operationId: getJournalEntry
      summary: Get one journal entry with its lines
      responses:
        '200':
          description: The journal entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntry' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /journal-entries/{entryId}/reverse:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    post:
      tags: [Journal Entries]
      operationId: reverseJournalEntry
      summary: Post a reversing entry (swaps every debit and credit)
      description: An entry can be reversed only once, and a reversal cannot itself be reversed.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReverseRequest' }
      responses:
        '201':
          description: Reversing entry posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntry' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /reports/trial-balance:
    get:
      tags: [Reports]
      operationId: getTrialBalance
      summary: Debit/credit balance of every account as of a date
      parameters:
        - name: as_of
          in: query
          description: Include entries dated on or before this day (default today)
          schema: { type: string, format: date }
      responses:
        '200':
          description: Trial balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrialBalance' }
        default: { $ref: '#/components/responses/Error' }

  /exports/general-ledger:
    post:
      tags: [Files]
      operationId: exportGeneralLedger
      summary: Write the General Ledger to a CSV file in the CSV directory
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRequest' }
      responses:
        '201':
          description: File written
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsvFile' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /files:
    get:
      tags: [Files]
      operationId: listCsvFiles
      summary: List CSV files in the CSV directory
      responses:
        '200':
          description: Files, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CsvFile' }
        default: { $ref: '#/components/responses/Error' }

  /files/{filename}:
    parameters:
      - $ref: '#/components/parameters/Filename'
    get:
      tags: [Files]
      operationId: downloadCsvFile
      summary: Download a CSV file
      responses:
        '200':
          description: File contents
          content:
            text/csv:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /imports/journal-entries:
    post:
      tags: [Files]
      operationId: importJournalEntries
      summary: Import journal entries from a CSV file in the CSV directory
      description: |
        **Planned (Step 2).** The server currently answers 501.
        The whole file is imported in one database transaction: if any entry
        is invalid, nothing is imported. Expected columns:
        `entry_key,entry_date,description,reference,account_code,debit,credit,memo`
        where rows sharing an `entry_key` form one journal entry and amounts are
        decimal strings with at most two fraction digits (e.g. `1234.56`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '201':
          description: All entries imported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '422': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Filename:
      name: filename
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CsvFilename' }
    From:
      name: from
      in: query
      description: Inclusive start date
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      description: Inclusive end date
      schema: { type: string, format: date }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Cents:
      description: Non-negative amount in cents.
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    SignedCents:
      description: Signed amount in cents (positive = debit balance, negative = credit balance).
      type: integer
      format: int64
      minimum: -9007199254740991
      maximum: 9007199254740991
    AccountType:
      type: string
      enum: [asset, liability, equity, revenue, expense]
    CsvFilename:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\.csv$'

    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, unreachable] }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code
              enum:
                - bad_request
                - validation_failed
                - not_found
                - conflict
                - not_implemented
                - internal_error
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [message]
                properties:
                  field:
                    type: string
                    description: JSON path of the offending field, e.g. `lines[1].debit_cents`
                  message: { type: string }

    Account:
      type: object
      required: [id, code, name, type, description, is_active, balance_cents, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/AccountType' }
        description: { type: string }
        is_active: { type: boolean }
        balance_cents:
          $ref: '#/components/schemas/SignedCents'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AccountCreate:
      type: object
      required: [code, name, type]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$'
          example: '1000'
        name: { type: string, minLength: 1, maxLength: 200, example: Cash }
        type: { $ref: '#/components/schemas/AccountType' }
        description: { type: string, maxLength: 1000, default: '' }
    AccountUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        is_active: { type: boolean }

    JournalLineCreate:
      type: object
      required: [account_id, debit_cents, credit_cents]
      additionalProperties: false
      description: Exactly one of debit_cents / credit_cents must be > 0.
      properties:
        account_id: { type: integer, format: int64, minimum: 1 }
        debit_cents: { $ref: '#/components/schemas/Cents' }
        credit_cents: { $ref: '#/components/schemas/Cents' }
        memo: { type: string, maxLength: 500, default: '' }
    JournalEntryCreate:
      type: object
      required: [entry_date, description, lines]
      additionalProperties: false
      properties:
        entry_date: { type: string, format: date }
        description: { type: string, minLength: 1, maxLength: 500 }
        reference: { type: string, maxLength: 100, default: '' }
        lines:
          type: array
          minItems: 2
          maxItems: 1000
          items: { $ref: '#/components/schemas/JournalLineCreate' }

    JournalLine:
      type: object
      required: [id, line_number, account_id, account_code, account_name, debit_cents, credit_cents, memo]
      properties:
        id: { type: integer, format: int64 }
        line_number: { type: integer }
        account_id: { type: integer, format: int64 }
        account_code: { type: string }
        account_name: { type: string }
        debit_cents: { $ref: '#/components/schemas/Cents' }
        credit_cents: { $ref: '#/components/schemas/Cents' }
        memo: { type: string }
    JournalEntry:
      type: object
      required: [id, entry_date, description, reference, posted_at, total_cents, lines]
      properties:
        id: { type: integer, format: int64 }
        entry_date: { type: string, format: date }
        description: { type: string }
        reference: { type: string }
        reverses_id:
          type: integer
          format: int64
          nullable: true
          description: Set when this entry reverses another entry
        reversed_by_id:
          type: integer
          format: int64
          nullable: true
          description: Set when another entry reverses this one
        posted_at: { type: string, format: date-time }
        total_cents:
          allOf: [{ $ref: '#/components/schemas/Cents' }]
          description: Sum of debits (always equal to the sum of credits)
        lines:
          type: array
          items: { $ref: '#/components/schemas/JournalLine' }
    ReverseRequest:
      type: object
      additionalProperties: false
      properties:
        entry_date:
          type: string
          format: date
          description: Date of the reversing entry (default today)
        description:
          type: string
          maxLength: 500
          description: Default "Reversal of entry #<id>"

    AccountLedger:
      type: object
      required: [account, opening_balance_cents, closing_balance_cents, lines]
      properties:
        account: { $ref: '#/components/schemas/Account' }
        opening_balance_cents: { $ref: '#/components/schemas/SignedCents' }
        closing_balance_cents: { $ref: '#/components/schemas/SignedCents' }
        lines:
          type: array
          items:
            type: object
            required: [journal_entry_id, line_id, entry_date, description, memo, debit_cents, credit_cents, running_balance_cents]
            properties:
              journal_entry_id: { type: integer, format: int64 }
              line_id: { type: integer, format: int64 }
              entry_date: { type: string, format: date }
              description: { type: string }
              reference: { type: string }
              memo: { type: string }
              debit_cents: { $ref: '#/components/schemas/Cents' }
              credit_cents: { $ref: '#/components/schemas/Cents' }
              running_balance_cents: { $ref: '#/components/schemas/SignedCents' }

    TrialBalance:
      type: object
      required: [as_of, rows, total_debit_cents, total_credit_cents]
      properties:
        as_of: { type: string, format: date }
        rows:
          type: array
          items:
            type: object
            required: [account_id, account_code, account_name, account_type, debit_cents, credit_cents]
            properties:
              account_id: { type: integer, format: int64 }
              account_code: { type: string }
              account_name: { type: string }
              account_type: { $ref: '#/components/schemas/AccountType' }
              debit_cents: { $ref: '#/components/schemas/Cents' }
              credit_cents: { $ref: '#/components/schemas/Cents' }
        total_debit_cents: { $ref: '#/components/schemas/Cents' }
        total_credit_cents: { $ref: '#/components/schemas/Cents' }

    ExportRequest:
      type: object
      additionalProperties: false
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
    CsvFile:
      type: object
      required: [filename, size_bytes, modified_at]
      properties:
        filename: { $ref: '#/components/schemas/CsvFilename' }
        size_bytes: { type: integer, format: int64 }
        modified_at: { type: string, format: date-time }
        row_count:
          type: integer
          description: Data rows written (export responses only)

    ImportRequest:
      type: object
      required: [filename]
      additionalProperties: false
      properties:
        filename: { $ref: '#/components/schemas/CsvFilename' }
    ImportResult:
      type: object
      required: [filename, entries_imported, lines_imported]
      properties:
        filename: { type: string }
        entries_imported: { type: integer }
        lines_imported: { type: integer }
