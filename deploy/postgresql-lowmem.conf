# Copy to /etc/postgresql/<version>/main/conf.d/ledger.conf and restart
# PostgreSQL. Sized for a ~512 MB container shared with the ledger service.
listen_addresses = 'localhost'
max_connections = 20
shared_buffers = 64MB
effective_cache_size = 192MB
work_mem = 4MB
maintenance_work_mem = 32MB
wal_buffers = 4MB
max_wal_size = 256MB
min_wal_size = 64MB
# Durability stays on: this is financial data.
synchronous_commit = on
fsync = on
